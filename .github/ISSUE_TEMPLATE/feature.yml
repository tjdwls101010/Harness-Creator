name: Feature request
description: Propose a new capability or behavior change.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: User problem
      description: Describe the concrete Claude Code or harness task that is difficult today.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Explain what a successful result would let the user do.
    validations:
      required: true
  - type: textarea
    id: current
    attributes:
      label: Current workaround
      description: Describe the manual configuration, script, or process used today.
  - type: textarea
    id: layer
    attributes:
      label: Layer considerations
      description: If known, explain whether this belongs in interview routing, generation, validation, documentation, or distribution.
  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: I searched existing issues for the same need.
          required: true
        - label: The request does not depend on an unsupported claim about Claude Code behavior.
          required: true
