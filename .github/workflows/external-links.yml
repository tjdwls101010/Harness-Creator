name: External links

on:
  pull_request:
    paths:
      - "**/*.md"
      - ".github/workflows/external-links.yml"
  schedule:
    - cron: "23 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    continue-on-error: ${{ github.event_name == 'pull_request' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check external links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          fail: true
          args: >-
            --no-progress
            --accept 100..=103,200..=299,429
            --exclude-path .git
            --exclude-path .tmp
            --exclude 'https://github.com/tjdwls101010/Harness-Creator/actions/workflows/ci.yml/badge.svg'
            --host-concurrency 2
            --host-request-interval 250ms
            --max-retries 2
            --timeout 30
            './**/*.md'
